[project]
name = "podcast-archive-copilot-api"
version = "0.1.0"
description = "FastAPI backend for Private Podcast Archive Copilot (M0 foundations)"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.9.0",
    "python-dotenv>=1.0.0",
    "sqlalchemy>=2.0.0",
    "alembic>=1.13.0",
    "psycopg[binary]>=3.2.0",
    "pgvector>=0.3.0",  # Required for pgvector.sqlalchemy.Vector column type (embeddings table, spec §13 + §17). Added in M1.
    "httpx>=0.27",  # For embedding provider API calls (M4)
    "python-multipart>=0.0.9",  # Required by FastAPI for File/UploadFile multipart form handling (M3 transcript upload endpoint)
]

[tool.setuptools.packages.find]
where = ["."]
